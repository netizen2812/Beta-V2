version: "3.8"

services:
  ai-bridge:
    build:
      context: ./ai_bridge
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    container_name: quran-ai-bridge
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://imamv2.vercel.app,https://www.imamapp.co,https://imamapp.co,http://localhost:3000}
      - TAFSIR_FAST_START=${TAFSIR_FAST_START:-1}
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./ai_bridge/data:/usr/src/app/data
      - ./ai_bridge/models:/usr/src/app/models
    # NOTE: No ports: mapping intentional — AI Bridge is internal only.
    networks:
      - quran-net
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "X-API-Key:${INTERNAL_API_KEY}", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  node-backend:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: quran-node-backend
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=${MONGO_URI}
      - AI_BRIDGE_URL=http://ai-bridge:8000
      - PORT=5001
      - NODE_ENV=${NODE_ENV:-production}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # FIX: These were missing from the original compose — all auth routes failed
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - FRONTEND_URL=${FRONTEND_URL:-https://imamv2.vercel.app}
    depends_on:
      ai-bridge:
        condition: service_healthy
    networks:
      - quran-net
    restart: always
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  quran-net:
    driver: bridge
